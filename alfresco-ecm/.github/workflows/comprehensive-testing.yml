name: Comprehensive Testing Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  # ========================================
  # SETUP AND VALIDATION
  # ========================================
  
  setup:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
            ~/.cache
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Validate package.json
        run: npm audit --audit-level=moderate

  # ========================================
  # DATABASE SETUP
  # ========================================
  
  database-setup:
    name: Database Setup & Seeding
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alfresco_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
          MONGO_INITDB_DATABASE: alfresco_test
        ports:
          - 27017:27017
      
      elasticsearch:
        image: elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432; do sleep 1; done
          until curl -s http://localhost:9200; do sleep 1; done
          until mongosh --host localhost:27017 --eval "db.version()"; do sleep 1; done
      
      - name: Run database migrations
        run: |
          psql -h localhost -U postgres -d alfresco_test -f init-scripts/postgres/01-init-database.sql
      
      - name: Seed test data
        run: |
          psql -h localhost -U postgres -d alfresco_test -f tests/fixtures/database-seed.sql
      
      - name: Generate dynamic test data
        run: node tests/fixtures/test-data-generator.js
      
      - name: Verify data seeding
        run: |
          psql -h localhost -U postgres -d alfresco_test -c "SELECT COUNT(*) FROM auth.users;"
          psql -h localhost -U postgres -d alfresco_test -c "SELECT COUNT(*) FROM content.documents;"

  # ========================================
  # UNIT TESTS
  # ========================================
  
  unit-tests:
    name: Unit Tests (100% Coverage)
    runs-on: ubuntu-latest
    needs: [setup, database-setup]
    strategy:
      matrix:
        service: [auth, document, workflow, search, records, collaboration]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Run unit tests for ${{ matrix.service }}
        run: |
          npm run test:unit -- --selectProjects="${{ matrix.service }}" --coverage
      
      - name: Check coverage threshold
        run: |
          npm run test:coverage:100 -- --selectProjects="${{ matrix.service }}"
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unit-${{ matrix.service }}
          name: unit-tests-${{ matrix.service }}

  # ========================================
  # INTEGRATION TESTS
  # ========================================
  
  integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [setup, database-setup]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alfresco_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Start API services
        run: |
          npm run start:auth &
          npm run start:document &
          npm run start:workflow &
          wait-on tcp:3001 tcp:3002 tcp:3003
      
      - name: Run integration tests
        run: npm run test:integration
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: test-results/

  # ========================================
  # E2E TESTS
  # ========================================
  
  e2e-tests:
    name: E2E Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: [setup, database-setup]
    strategy:
      matrix:
        browser: [chromium, firefox, webkit, edge]
        include:
          - browser: chromium
            project: 'Desktop Chrome'
          - browser: firefox
            project: 'Desktop Firefox'
          - browser: webkit
            project: 'Desktop Safari'
          - browser: edge
            project: 'Desktop Edge'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Start application
        run: |
          npm run docker:up
          npm run start:web &
          wait-on http://localhost:3000
      
      - name: Run E2E tests
        run: npx playwright test --project="${{ matrix.project }}"
      
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-artifacts-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/

  # ========================================
  # MOBILE TESTS
  # ========================================
  
  mobile-tests:
    name: Mobile Tests - ${{ matrix.device }}
    runs-on: ubuntu-latest
    needs: [setup, database-setup]
    strategy:
      matrix:
        device: ['iPhone 12', 'iPhone SE', 'Pixel 5', 'iPad']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit
      
      - name: Start application
        run: |
          npm run docker:up
          npm run start:web &
          wait-on http://localhost:3000
      
      - name: Run mobile tests
        run: npx playwright test --project="${{ matrix.device }}"
      
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: mobile-results-${{ matrix.device }}
          path: test-results/

  # ========================================
  # PERFORMANCE TESTS
  # ========================================
  
  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest
    needs: [setup, database-setup]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Start services
        run: |
          npm run docker:up
          npm run start:web &
          npm run start:auth &
          npm run start:document &
          wait-on http://localhost:3000 tcp:3001 tcp:3002
      
      - name: Run performance tests
        run: |
          npm run test:performance
      
      - name: Run Lighthouse audit
        run: |
          npx lighthouse http://localhost:3000 \
            --output=json \
            --output-path=./lighthouse-report.json \
            --only-categories=performance,accessibility,best-practices,seo
      
      - name: Check performance thresholds
        run: |
          node -e "
          const report = require('./lighthouse-report.json');
          const perf = report.categories.performance.score;
          if (perf < 0.9) {
            console.error('Performance score too low:', perf);
            process.exit(1);
          }
          "
      
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: |
            lighthouse-report.json
            test-results/artillery/

  # ========================================
  # ACCESSIBILITY TESTS
  # ========================================
  
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: [setup]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      
      - name: Start application
        run: |
          npm run docker:up
          npm run start:web &
          wait-on http://localhost:3000
      
      - name: Run accessibility tests
        run: npm run test:accessibility
      
      - name: Run pa11y audit
        run: |
          npx pa11y http://localhost:3000 \
            --reporter json > pa11y-report.json
      
      - name: Upload accessibility results
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-results
          path: |
            pa11y-report.json
            test-results/

  # ========================================
  # SECURITY TESTS
  # ========================================
  
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Run npm audit
        run: npm audit --production
      
      - name: Run security tests
        run: npm run test:security || true
      
      - name: OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Alfresco ECM'
          path: '.'
          format: 'JSON'
      
      - name: Upload security results
        uses: actions/upload-artifact@v3
        with:
          name: security-results
          path: reports/

  # ========================================
  # FINAL REPORT
  # ========================================
  
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, mobile-tests, performance-tests, accessibility-tests, security-tests]
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-results/
      
      - name: Generate consolidated report
        run: |
          echo "# Test Results Summary" > test-summary.md
          echo "## Unit Tests: ${{ needs.unit-tests.result }}" >> test-summary.md
          echo "## Integration Tests: ${{ needs.integration-tests.result }}" >> test-summary.md
          echo "## E2E Tests: ${{ needs.e2e-tests.result }}" >> test-summary.md
          echo "## Mobile Tests: ${{ needs.mobile-tests.result }}" >> test-summary.md
          echo "## Performance Tests: ${{ needs.performance-tests.result }}" >> test-summary.md
          echo "## Accessibility Tests: ${{ needs.accessibility-tests.result }}" >> test-summary.md
          echo "## Security Tests: ${{ needs.security-tests.result }}" >> test-summary.md
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
      
      - name: Upload final report
        uses: actions/upload-artifact@v3
        with:
          name: final-test-report
          path: |
            test-summary.md
            all-results/